[pytest]
# ── Test discovery ────────────────────────────────────────────────────────
testpaths = tests

# ── Live console logging ──────────────────────────────────────────────────
log_cli            = true
log_cli_level      = INFO
log_format         = %(asctime)s [%(levelname)s] %(message)s
log_date_format    = %Y-%m-%d %H:%M:%S

# ── Default CLI options ───────────────────────────────────────────────────
# -v                  → verbose output
# --html              → generate HTML report in reports/
# --self-contained-html → embed CSS/JS in the HTML file
# --tb=short          → short traceback on failures
addopts =
    -v
    --html=reports/pytest_script.html
    --self-contained-html
    --tb=short
